# ============================================================
# PolyGlot-StreamBaran - GitHub Actions Workflow
# المؤلف: Baran Avisat | Baranavisat@gmail.com
# ============================================================
# تشغيل مجدول للمنظومة على GitHub Actions (مجاني 2000 دقيقة/شهر)
# يمكن استخدامه لمعالجة دورية للملفات أو الاختبارات التلقائية
# ============================================================
name: PolyGlot-StreamBaran Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # تشغيل يومي عند منتصف الليل بتوقيت UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      media_url:
        description: 'رابط الفيديو للمعالجة (اختياري)'
        required: false
        default: ''
      target_lang:
        description: 'لغة الترجمة (ar, en, tr, ...)'
        required: true
        default: 'ar'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ------------------------------------------------------
  # المهمة 1: الاختبارات
  # ------------------------------------------------------
  test:
    name: تشغيل الاختبارات
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: تثبيت ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل الاختبارات
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ------------------------------------------------------
  # المهمة 2: المعالجة المبرمجة (Scheduled Processing)
  # ------------------------------------------------------
  process:
    name: المعالجة الدورية
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: تثبيت ffmpeg و yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: إعداد البيئة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "HF_TOKEN=$HF_TOKEN" >> .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> .env
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env

      - name: معالجة الوسائط
        run: |
          python main.py \
            --url "${{ github.event.inputs.media_url || '' }}" \
            --lang "${{ github.event.inputs.target_lang || 'ar' }}" \
            --provider gemini

      - name: رفع النتائج كـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-output
          path: |
            output/
            logs/
          retention-days: 30
